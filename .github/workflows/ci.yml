name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.13
      - run: uv sync --python 3.13
      - run: uv run ruff check --select F src tests
      - run: uv run python -m pytest -q

  app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.13 --group build
      - name: Build Spuza.app (unsigned)
        run: uv run pyinstaller packaging/spuza.spec --noconfirm
      - name: Zip the bundle
        run: ditto -c -k --keepParent dist/Spuza.app dist/Spuza-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Spuza-macos-unsigned
          path: dist/Spuza-macos.zip
          if-no-files-found: error
